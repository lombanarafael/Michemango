services:
  - type: web
    name: michemango-api
    runtime: node
    plan: starter
    region: ohio
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_ORIGIN
        value: https://michemango.netlify.app
      - key: CORS_ORIGINS
        value: https://michemango.netlify.app
      - key: DATABASE_URL
        fromDatabase:
          name: michemango-db
          property: connectionString
      - key: DATABASE_SSL
        value: "false"
      - key: SESSION_SECRET
        generateValue: true
      - key: SESSION_SAME_SITE
        value: lax
      - key: SESSION_SECURE
        value: "true"
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: OPENAI_API_KEY
        value: ""
      - key: OPENAI_MODEL
        value: gpt-4o-mini

databases:
  - name: michemango-db
    plan: basic-256mb
    region: ohio
    databaseName: michemango
    user: michemango
