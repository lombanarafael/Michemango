services:
  - type: web
    name: michemango-api
    runtime: node
    plan: free
    region: ohio
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_ORIGIN
        value: https://michemango.netlify.app
      - key: GITHUB_PAGES_ORIGIN
        value: https://lombanarafael.github.io
      - key: CORS_ORIGINS
        value: https://michemango.netlify.app,https://lombanarafael.github.io,http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000,http://127.0.0.1:3000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
